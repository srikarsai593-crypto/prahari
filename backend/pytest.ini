[pytest]
testpaths = tests
pythonpath = .

# -q by default: the suite is large enough that a per-test line is noise, and
# the useful signal on failure is the assertion, not the roster of passes.
addopts = -q --strict-markers --tb=short

# Starlette's TestClient warns about httpx on every import. It is not
# actionable from here and it buries real warnings.
filterwarnings =
    ignore::DeprecationWarning:starlette.*
    ignore:Using `httpx` with `starlette.testclient`:UserWarning
